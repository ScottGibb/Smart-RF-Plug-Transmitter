name: Build RF Transmitter Image (Pi 4, 32-bit)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (arm/v7) and export as tar
        uses: docker/build-push-action@v6
        with:
          context: ./socket_transmitter
          platforms: linux/arm/v7
          tags: rf-transmitter:latest
          outputs: type=docker,dest=/tmp/rf-transmitter.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rf-transmitter-arm-v7
          path: /tmp/rf-transmitter.tar
          retention-days: 14